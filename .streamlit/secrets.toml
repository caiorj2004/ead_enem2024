# =============================================================================
# secrets.toml – Template de credenciais para o Dashboard ENEM 2024
# =============================================================================
#
# Este arquivo contém APENAS valores de placeholder.
# Nunca commite credenciais reais neste arquivo.
#
# Como configurar no Streamlit Cloud
# ------------------------------------
# 1. Acesse seu app em https://share.streamlit.io
# 2. Clique em ⋮ → Settings → Secrets
# 3. Cole um dos formatos abaixo substituindo os valores de placeholder
#    pelos dados reais fornecidos pelo administrador do banco.
#
# Formato recomendado (seção [database])
# ----------------------------------------
# [database]
# host     = "seu_host"
# port     = 5432
# dbname   = "seu_banco"
# user     = "seu_usuario"
# password = "sua_senha"
#
# Formato alternativo (chaves no nível raiz, sem seção)
# -------------------------------------------------------
# host     = "seu_host"
# port     = 5432
# dbname   = "seu_banco"
# user     = "seu_usuario"
# password = "sua_senha"
#
# As queries são fixas no código (database.py) e consultam as tabelas:
#   ed_enem_2024_participantes, ed_enem_2024_resultados, municipio
# =============================================================================

[database]
host     = "SEU_HOST_AQUI"
port     = 5432
dbname   = "SEU_BANCO_AQUI"
user     = "SEU_USUARIO_AQUI"
password = "SUA_SENHA_AQUI"
