# =============================================================================
# secrets.toml – Template de credenciais para o Dashboard ENEM 2024
# =============================================================================
#
# Este arquivo contém APENAS valores de placeholder.
# Nunca commite credenciais reais neste arquivo.
#
# Como configurar no Streamlit Cloud
# ------------------------------------
# 1. Acesse seu app em https://share.streamlit.io
# 2. Clique em ⋮ → Settings → Secrets
# 3. Cole o bloco [database] abaixo substituindo os valores de placeholder
#    pelos dados reais fornecidos pelo administrador do banco.
#
# Formato das credenciais
# -----------------------
# [database]
# host     = "SEU_HOST_AQUI"         # ex.: db.exemplo.com.br
# port     = 5432                    # porta padrão do PostgreSQL
# dbname   = "SEU_BANCO_AQUI"        # nome do banco de dados
# user     = "SEU_USUARIO_AQUI"      # usuário com permissão de leitura
# password = "SUA_SENHA_AQUI"        # senha do usuário
# table    = "enem2024"              # nome da tabela (padrão: enem2024)
#
# Enquanto as credenciais não forem configuradas (ou enquanto os valores
# iniciarem com "SEU_"), o dashboard opera em modo template com dados
# sintéticos que espelham a estrutura dos microdados do ENEM 2024.
# =============================================================================

[database]
host     = "SEU_HOST_AQUI"
port     = 5432
dbname   = "SEU_BANCO_AQUI"
user     = "SEU_USUARIO_AQUI"
password = "SUA_SENHA_AQUI"
table    = "enem2024"
